name: Verify TechParts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - run: nuget restore wssTechParts2.0.sln
      - run: Copy-Item wssTechParts2.0/ConnectionStrings.example.config wssTechParts2.0/ConnectionStrings.config
      - run: msbuild wssTechParts2.0.sln /p:Configuration=Release
  database:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - run: mysql -h 127.0.0.1 -u root < database/ScriptTechParts.sql
      - run: mysql -h 127.0.0.1 -u root < database/demo.sql
      - run: mysql -h 127.0.0.1 -u root < database/demo_visual.sql
      - run: mysql -h 127.0.0.1 -u root < tests/cart.sql
